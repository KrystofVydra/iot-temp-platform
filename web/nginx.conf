# nginx config for serving the built SPA.
# The API is a separate service reached via VITE_API_URL (baked into the
# bundle at build time), so this server proxies nothing.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Standard SPA fallback: any path that doesn't match a real file falls
    # through to index.html so the React Router can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively. Vite emits hashed filenames under /assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entrypoint — it has to pick up new asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
