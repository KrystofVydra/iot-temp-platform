# Eclipse Mosquitto 2.x — production-ready configuration.
#
# Auth model:
#   - Anonymous access is disabled.
#   - Users live in /mosquitto/config/passwords (managed with mosquitto_passwd).
#   - Per-user topic ACLs live in /mosquitto/config/acl.
#
# Persistence:
#   - Retained messages and queued QoS 1/2 messages are persisted to /mosquitto/data.
#
# Logging:
#   - Logs go to stdout so the container runtime captures them.
#
# See infra/mosquitto/README.md for how to provision the passwords + acl files.

# ---------- Listeners ----------
# Plain MQTT for sensors and the ingestor (on the local Docker network in dev,
# behind Traefik / inside the Coolify network in prod).
listener 1883
protocol mqtt

# WebSockets listener for future browser-side MQTT clients. Optional.
listener 9001
protocol websockets

# ---------- Authentication ----------
allow_anonymous false
# passwords and acl live under /mosquitto/data so they sit on the persistent
# named volume; /mosquitto/config holds only read-only bind-mounted content.
password_file /mosquitto/data/passwords
acl_file /mosquitto/data/acl

# ---------- Persistence ----------
persistence true
persistence_location /mosquitto/data/

# ---------- Logging ----------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
