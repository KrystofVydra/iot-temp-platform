# Standalone Mosquitto compose file.
#
# Use this on the VPS (deployed via Coolify, or run directly with
# `docker compose -f infra/mosquitto/docker-compose.yml up -d`) when you
# want to run the broker on its own — independent of the rest of the
# platform's services.
#
# Storage layout:
#   - mosquitto.conf and helper scripts are baked into the image via the
#     local Dockerfile. (Coolify has a bug where single files aren't copied
#     to the application directory during deploys, which broke bind mounts.)
#   - The mosquitto-data named volume backs /mosquitto/data and persists:
#       - retained / queued message state (the broker's own use)
#       - the passwords and acl files (generated at runtime by the helpers)
#     Both lookup paths are pointed at /mosquitto/data in mosquitto.conf so
#     the named volume carries them across container rebuilds.
#
# Bootstrap:
#   docker compose -f infra/mosquitto/docker-compose.yml up -d
#   docker exec -e ADMIN_PASSWORD='...' -it mosquitto \
#       sh /mosquitto/config/scripts/init_admin.sh
#   docker compose -f infra/mosquitto/docker-compose.yml restart mosquitto

services:
  mosquitto:
    build: .
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data

volumes:
  mosquitto-data:
